name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (for example v0.1.1)"
        required: true
        type: string
      platforms:
        description: "Cibles Docker. amd64 par défaut ; multiarch uniquement sur demande."
        required: false
        default: linux/amd64
        type: choice
        options:
          - linux/amd64
          - linux/amd64,linux/arm64

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PLATFORMS: ${{ inputs.platforms || 'linux/amd64' }}

jobs:
  publish:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate tag
        id: version
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          if [ "${VERSION}" = "${TAG}" ] || ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag ${TAG} invalide : attendu vX.Y.Z ou vX.Y.Z-suffixe."
            exit 1
          fi
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "${PKG_VERSION}" != "${VERSION}" ]; then
            echo "::error::Tag ${TAG} ne correspond pas à package.json (${PKG_VERSION})."
            exit 1
          fi
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE="ghcr.io/${OWNER}/onir-cms"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          MAJOR_MINOR="$(printf '%s' "${VERSION}" | cut -d. -f1-2)"
          APP_TAGS="${IMAGE}:${VERSION},${IMAGE}:sha-${SHORT_SHA}"
          MIGRATE_TAGS="${IMAGE}:${VERSION}-migrate,${IMAGE}:sha-${SHORT_SHA}-migrate"
          if ! printf '%s' "${VERSION}" | grep -q '-'; then
            APP_TAGS="${APP_TAGS},${IMAGE}:${MAJOR_MINOR},${IMAGE}:latest"
          fi
          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "image=${IMAGE}"
            echo "app_tags=${APP_TAGS}"
            echo "migrate_tags=${MIGRATE_TAGS}"
          } >> "${GITHUB_OUTPUT}"

      - name: QEMU
        if: contains(env.PLATFORMS, 'arm64')
        uses: docker/setup-qemu-action@v3

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push application
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.version.outputs.app_tags }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=runner
          provenance: true
          sbom: true

      - name: Build and push migrations
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.version.outputs.migrate_tags }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate
          provenance: true
          sbom: true

      - name: Create GitHub release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists (created by release-please)."
            exit 0
          fi
          if printf '%s' "${{ steps.version.outputs.version }}" | grep -q '-'; then
            gh release create "${TAG}" --verify-tag --generate-notes --prerelease
          else
            gh release create "${TAG}" --verify-tag --generate-notes
          fi
