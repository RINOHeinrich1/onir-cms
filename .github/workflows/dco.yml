name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  signed-off-by:
    name: Signed-off-by check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify Developer Certificate of Origin sign-off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          for commit in $(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}"); do
            author="$(git log -1 --format='%an <%ae>' "${commit}")"
            subject="$(git log -1 --format='%s' "${commit}")"
            if printf '%s\n%s\n' "${author}" "${subject}" | grep -Eiq 'dependabot|release-please|github-actions\[bot\]|^chore\(main\): release '; then
              echo "Skipping automated commit ${commit} (${author})."
              continue
            fi
            if ! git log -1 --format=%B "${commit}" | grep -Eiq '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::Commit ${commit} is missing a Signed-off-by line. Use: git commit -s"
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            echo "All commits in the pull request must be signed off (DCO 1.1)."
            exit 1
          fi
