services:
  standalone-edge:
    build:
      context: .
      dockerfile: Dockerfile.standalone-edge
    image: onir-cms-standalone-edge:local
    restart: unless-stopped
    env_file:
      - .env.standalone-edge
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
