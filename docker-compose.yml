# PostgreSQL local pour le développement.
# Port hôte 5433 pour ne pas entrer en conflit avec un PostgreSQL déjà installé.
services:
  postgres:
    image: postgres:16
    container_name: onir-cms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: onir_cms
      POSTGRES_USER: onir_cms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onir_cms}
    ports:
      - "5433:5432"
    volumes:
      - onir_cms_pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onir_cms -d onir_cms"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  onir_cms_pgdata:
