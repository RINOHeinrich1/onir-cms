name: onir-cms-preprod

x-app-environment: &app-environment
  DATABASE_URL: postgres://onir_cms:${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env.preprod}@db:5432/onir_cms
  SESSION_SECRET: ${SESSION_SECRET:?Définir SESSION_SECRET dans .env.preprod}
  LINK_TOKEN_KEY: ${LINK_TOKEN_KEY:?Définir LINK_TOKEN_KEY dans .env.preprod}
  AI_PROVIDER_KEY: ${AI_PROVIDER_KEY:?Définir AI_PROVIDER_KEY dans .env.preprod}
  AI_ALLOW_PRIVATE_NETWORKS: ${AI_ALLOW_PRIVATE_NETWORKS:-false}
  DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-preprod-admin@onirtech.com}
  DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:?Définir DEFAULT_ADMIN_PASSWORD dans .env.preprod}
  APP_URL: ${APP_URL:-https://preprod-cms.onirtech.com}
  AI_API_TOKEN: ${AI_API_TOKEN:-}
  AI_PRODUCT_ID: ${AI_PRODUCT_ID:-}
  AI_MODEL: ${AI_MODEL:-Qwen/Qwen3.5-122B-A10B-FP8}
  MEDIA_DIR: /app/var/media

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: onir_cms
      POSTGRES_USER: onir_cms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env.preprod}
    ports:
      - "127.0.0.1:${PREPROD_DB_PORT:-5436}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init/000-extensions.sql:/docker-entrypoint-initdb.d/000-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onir_cms -d onir_cms"]
      interval: 5s
      timeout: 5s
      retries: 20

  media-init:
    image: alpine:3.20
    restart: "no"
    command: ["sh", "-c", "chown -R 1000:1000 /media"]
    volumes:
      - media_data:/media

  migrate:
    image: ${PREPROD_IMAGE:-ghcr.io/rinoheinrich1/onir-cms}:${PREPROD_IMAGE_TAG:?Définir PREPROD_IMAGE_TAG dans .env.preprod}-migrate
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    image: ${PREPROD_IMAGE:-ghcr.io/rinoheinrich1/onir-cms}:${PREPROD_IMAGE_TAG:?Définir PREPROD_IMAGE_TAG dans .env.preprod}
    environment: *app-environment
    ports:
      - "127.0.0.1:${PREPROD_APP_PORT:-3200}:3000"
    volumes:
      - media_data:/app/var/media
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      media-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  db_data:
  media_data:
