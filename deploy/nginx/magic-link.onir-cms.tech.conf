# Liens publics et widgets ONIR CMS — magic-link.onir-cms.tech
# Même application Next.js de production, pour /l, /embed, /widget et les API publiques.

server {
    listen 80;
    listen [::]:80;
    server_name magic-link.onir-cms.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name magic-link.onir-cms.tech;

    access_log /var/log/nginx/magic-link.onir-cms.tech.access.log;
    error_log  /var/log/nginx/magic-link.onir-cms.tech.error.log;

    client_max_body_size 64m;

    ssl_certificate /etc/letsencrypt/live/magic-link.onir-cms.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/magic-link.onir-cms.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
